<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--가로를 다 사용하는 것이 block element-->

    <style>
        h1 { 
            background-color: skyblue;
            width: 40%;
            padding: 20px;
            padding-top: 100px;
            /*padding: npx mpx qpx ... 위치에 따라 적용하는 것이 다름*/
            margin:40px;/*element 바깥의 영역 - border의 바깥 영역*/
            border: 1px solid red;
        }
        
    </style>
</head>
<body>
    <h1>This is a Heading</h1>
</body>
</html>
